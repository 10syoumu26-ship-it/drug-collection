<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0c1726"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><title>DRUG COLLECTION v1.2</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:#edf3fc;background:#0b1422;font-size:15px}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#183356 0%,#0b1422 56%)}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.35;cursor:default}.app{max-width:600px;margin:auto;padding:24px 17px 100px}.head{display:flex;align-items:center;justify-content:space-between;margin:7px 0 24px}.logo{font-size:12px;letter-spacing:.22em;font-weight:800;color:#91c5ff}.brand{font-size:25px;font-weight:850;letter-spacing:-.04em}.mini{color:#9aafc8;font-size:12px;line-height:1.7}.panel{background:#142337;border:1px solid #2b405d;border-radius:18px;padding:17px;margin:13px 0}.hero{background:linear-gradient(140deg,#1e4565,#13283e 65%,#17283f);border:1px solid #426182}.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#1a2d43;border-radius:13px;padding:12px;text-align:center}.stat b{display:block;font-size:23px;color:#d6ebff}.stat span{font-size:11px;color:#a6bdd5}.section{font-size:16px;font-weight:800;margin:26px 0 13px}.toolbar{display:flex;gap:8px;margin:13px 0}.toolbar input,.toolbar select{min-width:0;width:100%;background:#17283e;border:1px solid #395371;border-radius:12px;color:#e9f4ff;padding:12px}.druglist{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.drug{position:relative;min-height:137px;text-align:left;border:1px solid #344b66;border-radius:17px;padding:15px;background:linear-gradient(155deg,#182b43,#101d2e);color:#fff}.drug.unlocked{border-color:#b9a264;background:linear-gradient(150deg,#3a3642,#142a3f)}.drug .title{font-weight:800;font-size:16px;margin:9px 0}.drug small{display:block;color:#9cb0c8;font-size:11px}.tag{display:inline-block;padding:5px 9px;border-radius:99px;font-size:11px;background:#263d58;color:#c5deff}.gold{background:#55462c;color:#ffe3a1}.progress{height:7px;border-radius:30px;background:#2c4058;overflow:hidden;margin-top:11px}.progress i{display:block;height:100%;background:#62cbb0;border-radius:30px}.btn{background:#70c9fc;color:#091829;border:0;padding:14px 17px;border-radius:13px;font-weight:850;width:100%;margin-top:12px}.btn.alt{background:#263d57;color:#e9f5ff;border:1px solid #426080}.btn.ghost{background:transparent;border:1px solid #435a77;color:#dbeeff}.back{background:none;border:0;color:#a9d8ff;padding:8px 0 20px}.pill{font-size:43px;text-align:center;line-height:1.3}.name{font-size:28px;font-weight:850;text-align:center;margin:6px 0}.stageRow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:22px 0}.stage{border:1px solid #3a526e;background:#14273d;padding:15px 5px;border-radius:12px;text-align:center;font-size:12px}.stage.done{border-color:#6ecfb1;background:#174037}.stage.active{border-color:#75bfff}.stage span{display:block;font-size:24px;margin-bottom:5px}.questionTitle{font-size:18px;font-weight:850;line-height:1.55;margin:15px 0 20px}.option{width:100%;text-align:left;display:flex;align-items:flex-start;gap:12px;background:#1b2d43;border:1px solid #37506d;color:#ecf5ff;padding:15px;border-radius:13px;margin:9px 0;line-height:1.5}.option.chosen{border-color:#7ac5fc}.option.correct{border-color:#61cfa2;background:#1c453d}.option.wrong{border-color:#f28282;background:#4e3039}.letter{flex-shrink:0;font-weight:900;color:#8fcdf5}.feedback{padding:16px;border-radius:13px;background:#18374a;border:1px solid #416b79;margin:16px 0;line-height:1.7}.feedback.bad{background:#382b37;border-color:#814e58}.detail{padding:13px 0;border-bottom:1px solid #31465d}.detail h4{color:#8ad8ff;margin:0 0 5px;font-size:12px}.detail p{margin:0;line-height:1.6;font-size:14px}.medal{font-size:48px;text-align:center}.nav{position:fixed;bottom:0;left:0;right:0;background:#0b1728eb;border-top:1px solid #2b4764;display:flex;justify-content:center;padding:10px 8px calc(11px + env(safe-area-inset-bottom));z-index:10;backdrop-filter:blur(14px)}.nav-inner{display:flex;max-width:600px;width:100%}.nav button{flex:1;background:none;border:0;color:#849bb7;font-size:12px;padding:7px}.nav button.sel{color:#89d3ff;font-weight:850}.muted{color:#a2b7d0}.notice{font-size:11px;color:#a6bbd2;line-height:1.7}a{color:#90ccff}.flex{display:flex;align-items:center;justify-content:space-between;gap:10px}.hide{display:none}label{cursor:pointer}.check{accent-color:#78c9ff}.empty{padding:30px;text-align:center;color:#9cb6cb}.overline{font-size:11px;color:#91bdd9;letter-spacing:.14em;font-weight:800}.big{font-size:33px;font-weight:900}.spark{color:#ffdc88}.subline{font-size:12px;color:#bdd0e7;line-height:1.7}.note{padding:12px;border-radius:12px;background:#29394c;font-size:12px;line-height:1.8}
</style></head><body><main id="app" class="app"></main><nav class="nav"><div class="nav-inner"><button data-tab="home">⌂<br>ホーム</button><button data-tab="catalog">▦<br>図鑑</button><button data-tab="records">▥<br>記録</button><button data-tab="settings">⚙<br>設定</button></div></nav><script src="drugs.js"></script><script>
'use strict';
const PMDA_PORTAL="https://www.pmda.go.jp/PmdaSearch/iyakuSearch/";
const PMDA_LINKS={"アムロジピン": ["アムロジン錠／OD錠", "https://www.pmda.go.jp/PmdaSearch/rdDetail/iyaku/2171022F1045_3"], "エンパグリフロジン": ["ジャディアンス錠", "https://www.pmda.go.jp/PmdaSearch/rdDetail/iyaku/3969023F1023_1"], "セマグルチド": ["オゼンピック皮下注2mg", "https://www.pmda.go.jp/PmdaSearch/rdDetail/iyaku/2499418G4027_1"]};
const KEY='drugcollection_v1_save';let save={version:1,progress:{},history:[]};try{const a=JSON.parse(localStorage.getItem(KEY));if(a&&a.version===1)save=a}catch(e){};let view='home',selected=null,session=null,search='',category='すべて';const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){alert('保存できませんでした。容量を確認してください。')}};const prog=d=>save.progress[d.id]||{stage:0,attempts:0,correct:0,answered:0,mistakes:{},seen:[]};const setprog=(d,p)=>{save.progress[d.id]=p;persist()};const stages=['BASIC','ADVANCED','MASTER'];const cats=['すべて',...new Set(DRUGS.map(d=>d.category))];function setView(v){view=v;session=null;render();window.scrollTo(0,0)}function rand(seed){let x=seed|0;return()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return ((x>>>0)%100000)/100000}}function shuffle(a,r=Math.random){return [...a].sort(()=>r()-.5)}function pick(a,r){return a[Math.floor(r()*a.length)]}
function candidates(d,k,level){let pool=DRUGS.filter(x=>x.id!==d.id&&x[k]!==d[k]);if(level>0){let near=pool.filter(x=>x.category===d.category);if(near.length>=3)pool=near}return pool}
function createQuiz(d,level,seen){const r=rand(Date.now()+(level+1)*137+Math.floor(Math.random()*100000));const topics=shuffle(TOPICS,r);const modes=shuffle(['single','single','single','bool','bool','multi'],r);return topics.map(([key,label],idx)=>{let mode=modes[idx],near=candidates(d,key,level),others=shuffle(near,r);if(others.length<3)others=shuffle(DRUGS.filter(x=>x.id!==d.id&&x[key]!==d[key]),r);let pool=others.filter(x=>!seen.includes(`${level}:${key}:${x.id}`));if(pool.length<3)pool=others;let unique=[...new Map(pool.map(x=>[x[key],x])).values()];if(unique.length<3)unique=[...new Map(others.map(x=>[x[key],x])).values()];if(unique.length<3)unique=[...new Map(DRUGS.filter(x=>x.id!==d.id&&x[key]!==d[key]).map(x=>[x[key],x])).values()];let wrong=unique.slice(0,3);let q={key,label,mode,correct:[],options:[],explanation:`${d.name}：${label}は「${d[key]}」。`,sourceIds:wrong.map(x=>x.id)};
if(mode==='single'){q.title=level===2?`国家試験の知識確認：${d.name}の「${label}」に合致する記述を選べ。`:level===1?`他の薬剤と区別して考えよう。${d.name}の「${label}」として適切なのは？`:`${d.name}の「${label}」として最も適切なのはどれか。`;q.options=shuffle([{t:d[key],ok:true},...wrong.map(x=>({t:x[key],ok:false}))],r);q.correct=q.options.map((x,i)=>x.ok?i:-1).filter(i=>i>=0)}
else if(mode==='bool'){let truth=r()>.5;let statement=truth?d[key]:wrong[0][key];q.title=`${d.name}の「${label}」は「${statement}」である。`;q.options=[{t:'正しい',ok:truth},{t:'誤り',ok:!truth}];q.correct=[truth?0:1]}
else{let alt=TOPICS.find(([k])=>k!==key&&k!=='caution')||TOPICS[0];let bad1=wrong[0],bad2=DRUGS.find(x=>x.id!==d.id&&x[alt[0]]!==d[alt[0]])||wrong[1];q.title=`${d.name}について正しい記述をすべて選べ。`;q.options=shuffle([{t:`${label}：${d[key]}`,ok:true},{t:`${alt[1]}：${d[alt[0]]}`,ok:true},{t:`${label}：${bad1[key]}`,ok:false},{t:`${alt[1]}：${bad2[alt[0]]}`,ok:false}],r);q.correct=q.options.map((x,i)=>x.ok?i:-1).filter(i=>i>=0);q.explanation+=` また${alt[1]}は「${d[alt[0]]}」。`}
return q})}
function startDrug(id){selected=DRUGS.find(x=>x.id===id);view='drug';render();scrollTo(0,0)}function startSession(){const p=prog(selected);let level=Math.min(p.stage,2);session={d:selected,level,questions:createQuiz(selected,level,p.seen||[]),i:0,chosen:[],marked:[],complete:false};view='quiz';render();scrollTo(0,0)}function answer(i){let s=session;if(s.marked.length)return;if(s.questions[s.i].mode==='multi'){s.chosen=s.chosen.includes(i)?s.chosen.filter(x=>x!==i):[...s.chosen,i]}else{s.chosen=[i];s.marked=[...s.chosen];}render()}function submitMulti(){if(!session.chosen.length)return;session.marked=[...session.chosen];render()}function nextQuestion(){const s=session,q=s.questions[s.i];const correct=s.marked.length===q.correct.length&&q.correct.every(i=>s.marked.includes(i));s.questions[s.i].wasCorrect=correct; s.i++;s.chosen=[];s.marked=[];if(s.i>=s.questions.length){finishQuiz();}else render();scrollTo(0,0)}function finishQuiz(){const s=session,p=prog(s.d),n=s.questions.filter(q=>q.wasCorrect).length;const old=p.stage;p.attempts++;p.correct+=n;p.answered+=6;s.questions.forEach(q=>{if(!q.wasCorrect)p.mistakes[q.key]=(p.mistakes[q.key]||0)+1;(p.seen||(p.seen=[])).push(...q.sourceIds.map(id=>`${s.level}:${q.key}:${id}`))});p.seen=p.seen.slice(-150);if(n===6&&p.stage===s.level&&p.stage<3)p.stage++;setprog(s.d,p);save.history.unshift({id:s.d.id,name:s.d.name,level:s.level,score:n,date:new Date().toISOString()});save.history=save.history.slice(0,300);persist();s.score=n;s.passed=n===6&&old===s.level;s.complete=true;view='result';render()}
function header(title,desc=''){return `<div class="head"><div><div class="logo">DRUG COLLECTION <span style="color:#f3c772">v1.1</span></div><div class="brand">${title}</div>${desc?`<div class="mini">${desc}</div>`:''}</div><div style="font-size:30px">💊</div></div>`}function tile(d){const p=prog(d);return `<button class="drug ${p.stage===3?'unlocked':''}" onclick="startDrug('${d.id}')"><span class="tag ${p.stage===3?'gold':''}">${p.stage===3?'✦ 獲得済':esc(d.category)}</span><div class="title">${esc(d.name)}</div><small>${p.stage===3?'カードを閲覧':p.stage===0?'未習得':`${stages[p.stage]} 挑戦中`}</small><div class="progress"><i style="width:${p.stage*100/3}%"></i></div></button>`}
function home(){const n=DRUGS.filter(d=>prog(d).stage===3).length,playing=DRUGS.filter(d=>prog(d).stage>0&&prog(d).stage<3);return header('薬を覚えて、集めよう','6項目×3段階の薬剤チャレンジ')+`<div class="panel hero"><div class="overline">MY COLLECTION</div><div style="margin:10px 0"><span class="big">${n}</span><span class="muted"> / ${DRUGS.length} 枚獲得</span></div><div class="progress"><i style="width:${n/DRUGS.length*100}%"></i></div><p class="subline">薬剤ごとにBASIC → ADVANCED → MASTERを全問正解するとカードが解放されます。</p><button class="btn" onclick="setView('catalog')">薬剤を選んで挑戦する →</button></div><div class="section">学習の状況</div><div class="statrow"><div class="stat"><b>${playing.length}</b><span>挑戦中</span></div><div class="stat"><b>${save.history.length}</b><span>挑戦回数</span></div><div class="stat"><b>${save.history.filter(h=>h.score===6).length}</b><span>全問正解</span></div></div><div class="section">続きから挑戦</div>${playing.length?`<div class="druglist">${playing.slice(0,6).map(tile).join('')}</div>`:`<div class="panel muted">まだ挑戦中の薬剤はありません。図鑑から薬剤を選ぼう。</div>`}<div class="section">はじめての方へ</div><div class="panel"><p class="subline">1薬剤につき6問。3つの難易度を順番にクリアしてカードを獲得。誤答しても進捗は失われません。</p></div>`}
function catalog(){let arr=DRUGS.filter(d=>(category==='すべて'||category===d.category)&&d.name.includes(search));return header('カード図鑑',`${DRUGS.filter(d=>prog(d).stage===3).length} / ${DRUGS.length}枚 獲得済`)+`<div class="toolbar"><input id="search" placeholder="薬剤名で検索" value="${esc(search)}" oninput="search=this.value;refreshList()"><select id="cat" onchange="category=this.value;refreshList()">${cats.map(c=>`<option ${c===category?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div id="list" class="druglist">${arr.map(tile).join('')}</div><div id="empty" class="empty" style="display:${arr.length?'none':'block'}">該当する薬剤がありません</div>`}function refreshList(){let a=DRUGS.filter(d=>(category==='すべて'||category===d.category)&&d.name.includes(search));document.getElementById('list').innerHTML=a.map(tile).join('');document.getElementById('empty').style.display=a.length?'none':'block'}
function drugView(){const d=selected,p=prog(d);let level=Math.min(p.stage,2);return `<button class="back" onclick="setView('catalog')">‹ 図鑑に戻る</button><div class="panel ${p.stage===3?'hero':''}"><div class="overline">${esc(d.category)} / ${esc(d.id.toUpperCase())}</div><div class="pill">${p.stage===3?'🏆':'💊'}</div><div class="name">${esc(d.name)}</div><div class="mini" style="text-align:center">${p.stage===3?'✦ MASTER CARD 獲得済':'3段階を攻略してカードを獲得'}</div><div class="stageRow">${stages.map((s,i)=>`<div class="stage ${p.stage>i?'done':level===i?'active':''}"><span>${p.stage>i?'✓':i===0?'Ⅰ':i===1?'Ⅱ':'Ⅲ'}</span>${s}</div>`).join('')}</div><button class="btn" onclick="startSession()">${p.stage===3?'MASTER を復習する':`${stages[level]} に挑戦する`} →</button>${p.stage===3?`<button class="btn alt" onclick="showCard()">獲得したカードを見る</button>`:''}<div class="note" style="margin-top:13px">各段階で「分類・作用機序・適応・副作用・禁忌や注意・特記事項」を各1問出題。すべて正解すると次へ進めます。</div></div>${pmdaSection(d)}`}
const PRODUCT_NOTES={
'アムロジピン':'アムロジンの錠剤・OD錠などで用法や取扱いに違いがあります。',
'エンパグリフロジン':'ジャディアンス25mg錠の承認適応は2型糖尿病。10mg錠は慢性心不全・慢性腎臓病にも適応があります（条件あり）。',
'セマグルチド':'オゼンピック皮下注は週1回投与。経口製剤などは用法や注意が異なるため、製品を指定して確認してください。'
};
function pmdaSection(d){const v=PMDA_LINKS[d.name];return `<div class="panel"><div class="overline">公式電子添文</div><p class="subline">${v?`代表製剤：${esc(v[0])}`:`PMDAで一般名「${esc(d.name)}」を検索し、製剤を選択してください。`}</p>${PRODUCT_NOTES[d.name]?`<div class="note">${esc(PRODUCT_NOTES[d.name])}</div>`:''}${v?`<a class="btn alt" style="display:block;text-align:center;text-decoration:none" target="_blank" rel="noopener noreferrer" href="${v[1]}">📄 ${esc(v[0])}の電子添文を開く ↗</a>`:''}<a class="btn ghost" style="display:block;text-align:center;text-decoration:none" target="_blank" rel="noopener noreferrer" href="${PMDA_PORTAL}">PMDAで一般名から検索 ↗</a><p class="notice">適応、禁忌、用法・注意事項は製剤・規格・投与経路で異なる場合があります。実際の使用時には該当製品の最新電子添文をご確認ください。</p></div>`}
function showCard(){view='card';render()}function cardView(){const d=selected,p=prog(d);return `<button class="back" onclick="startDrug('${d.id}')">‹ 薬剤に戻る</button><div class="panel hero"><div class="flex"><span class="overline">COLLECTOR CARD / ${esc(d.id.toUpperCase())}</span><span class="tag gold">★ MASTER</span></div><div class="pill" style="margin:22px 0 0">🏆</div><div class="name">${esc(d.name)}</div><p class="mini" style="text-align:center">${esc(d.category)}</p>${TOPICS.map(([key,label])=>`<div class="detail"><h4>${label}</h4><p>${esc(d[key])}</p></div>`).join('')}<p class="notice">※一般名ごとの代表的な学習用要約です。製剤・規格・投与経路で適応や注意が異なる場合があります。実際の使用時は該当製剤の最新電子添文を確認してください。</p><button class="btn alt" onclick="startDrug('${d.id}')">復習に戻る</button></div>${pmdaSection(d)}`}
function quizView(){const s=session,q=s.questions[s.i],answered=s.marked.length>0,isMulti=q.mode==='multi',ok=answered&&s.marked.length===q.correct.length&&q.correct.every(x=>s.marked.includes(x));return `<button class="back" onclick="startDrug('${s.d.id}')">‹ 挑戦を中断</button><div class="flex"><span class="tag">${stages[s.level]}</span><span class="mini">${s.i+1} / 6問</span></div><div class="progress"><i style="width:${(s.i+1)/6*100}%"></i></div><div class="panel"><div class="overline">${esc(s.d.name)} / ${q.label}</div><div class="questionTitle">${esc(q.title)}</div><p class="mini">${q.mode==='multi'?'複数選択：正しいものをすべて選び、解答を確定してください。':q.mode==='bool'?'正誤判定':'4択問題：正しいものを1つ選択'}</p>${q.options.map((o,i)=>`<button class="option ${answered?(o.ok?'correct':s.marked.includes(i)?'wrong':''):s.chosen.includes(i)?'chosen':''}" ${answered?'disabled':''} onclick="answer(${i})"><span class="letter">${q.mode==='bool'?(i===0?'○':'×'):String.fromCharCode(65+i)}</span><span>${esc(o.t)}</span></button>`).join('')}${!answered&&isMulti?`<button class="btn" onclick="submitMulti()" ${s.chosen.length?'':'disabled'}>解答を確定する</button>`:''}${answered?`<div class="feedback ${ok?'':'bad'}"><b>${ok?'✓ 正解！':'✕ 不正解'}</b><div>${esc(q.explanation)}</div>${!ok?`<div class="mini">正解：${q.correct.map(i=>q.mode==='bool'?(i===0?'正しい':'誤り'):String.fromCharCode(65+i)).join('・')}</div>`:''}</div><button class="btn" onclick="nextQuestion()">${s.i===5?'結果を見る':'次の問題へ'} →</button>`:''}</div>`}
function resultView(){const s=session,p=prog(s.d),unlock=p.stage===3&&s.passed;return `<div class="panel hero"><div class="medal">${unlock?'🏆':s.passed?'✨':s.score>=4?'📘':'💪'}</div><div class="overline" style="text-align:center">${esc(s.d.name)} / ${stages[s.level]}</div><div class="name">${s.score} / 6問正解</div><p class="subline" style="text-align:center">${unlock?'MASTER達成！薬剤カードを獲得しました。':s.passed?'全問正解！次の段階が解放されました。':'全問正解でクリア！苦手項目を確認して再挑戦しよう。'}</p>${s.questions.map(q=>`<div class="detail"><h4>${q.wasCorrect?'✓':'✕'} ${q.label}</h4><p>${esc(s.d[q.key])}</p></div>`).join('')}${unlock?`<button class="btn" onclick="showCard()">獲得カードを見る</button>`:`<button class="btn" onclick="startSession()">${s.passed?'次の段階に挑戦':'同じ段階に再挑戦'} →</button>`}<button class="btn alt" onclick="startDrug('${s.d.id}')">薬剤トップへ</button></div>`}
function recordsView(){let top=DRUGS.filter(d=>prog(d).attempts).sort((a,b)=>prog(b).attempts-prog(a).attempts);let mistakes={};DRUGS.forEach(d=>Object.entries(prog(d).mistakes||{}).forEach(([k,n])=>mistakes[k]=(mistakes[k]||0)+n));return header('学習記録','挑戦状況と苦手項目')+`<div class="statrow"><div class="stat"><b>${DRUGS.filter(d=>prog(d).stage===3).length}</b><span>獲得カード</span></div><div class="stat"><b>${save.history.length}</b><span>挑戦回数</span></div><div class="stat"><b>${save.history.filter(h=>h.score===6).length}</b><span>全問正解</span></div></div><div class="section">間違えた項目</div><div class="panel">${TOPICS.map(([k,label])=>`<div class="flex" style="padding:8px 0"><span>${label}</span><b>${mistakes[k]||0}回</b></div>`).join('')}</div><div class="section">最近の挑戦</div><div class="panel">${save.history.length?save.history.slice(0,20).map(h=>`<div class="detail"><div class="flex"><b>${esc(h.name)}</b><span class="tag">${h.score}/6</span></div><div class="mini">${stages[h.level]} ・ ${new Date(h.date).toLocaleString('ja-JP')}</div></div>`).join(''):'まだ記録がありません'}</div>`}
function exportData(){const blob=new Blob([JSON.stringify(save,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='drug_collection_backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}function importData(e){const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(d.version!==1||typeof d.progress!=='object'||!Array.isArray(d.history))throw Error('形式が違います');if(!confirm('現在の学習記録をバックアップの内容で上書きしますか？'))return;save=d;persist();setView('home')}catch(err){alert('バックアップファイルを読み込めませんでした')}})}
function settingsView(){return header('設定','保存・データについて')+`<div class="panel"><b>DRUG COLLECTION v1.2</b><p class="subline">30薬剤収録／3段階／6項目・6問／自動問題生成。端末内に学習履歴を保存します。</p><button class="btn alt" onclick="exportData()">学習データをバックアップする</button><p class="mini">バックアップから復元</p><input style="max-width:100%;color:white" type="file" accept=".json,application/json" onchange="importData(event)"></div><div class="panel"><b>医薬品情報について</b><p class="notice">収録内容は学習用の要約です。掲載する代表製剤以外では適応・禁忌・用法等が異なる場合があります。薬剤情報と問題の全件照合は継続中であり、臨床判断には使用しないでください。</p><a href="https://www.pmda.go.jp/PmdaSearch/iyakuSearch/" target="_blank" rel="noopener">PMDA 医療用医薬品情報検索 ↗</a></div><div class="panel"><b>データ管理</b><p class="notice">ブラウザや端末のデータ消去で学習記録が失われることがあります。定期的にバックアップしてください。</p><button class="btn ghost" onclick="if(confirm('すべての学習記録を削除します。よろしいですか？')){save={version:1,progress:{},history:[]};persist();setView('home')}">学習記録を初期化</button></div>`}
function render(){app.innerHTML=view==='home'?home():view==='catalog'?catalog():view==='drug'?drugView():view==='quiz'?quizView():view==='result'?resultView():view==='card'?cardView():view==='records'?recordsView():settingsView();document.querySelectorAll('.nav button').forEach(b=>{let v=view==='drug'||view==='quiz'||view==='result'||view==='card'?'catalog':view;b.classList.toggle('sel',b.dataset.tab===v);b.onclick=()=>setView(b.dataset.tab)})}render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
