const KEY='drugcollection_v1_save';let save={version:1,progress:{},history:[]};try{const a=JSON.parse(localStorage.getItem(KEY));if(a&&a.version===1)save=a}catch(e){};let view='home',selected=null,session=null,search='',category=null;const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){alert('保存できませんでした。容量を確認してください。')}};const prog=d=>save.progress[d.id]||{stage:0,attempts:0,correct:0,answered:0,mistakes:{},seen:[]};const setprog=(d,p)=>{save.progress[d.id]=p;persist()};const stages=['BASIC','ADVANCED','MASTER'];const cats=['すべて',...new Set(DRUGS.map(d=>d.category))];function setView(v){view=v;session=null;render();window.scrollTo(0,0)}function rand(seed){let x=seed|0;return()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return ((x>>>0)%100000)/100000}}function shuffle(a,r=Math.random){return [...a].sort(()=>r()-.5)}function pick(a,r){return a[Math.floor(r()*a.length)]}

function createQuiz(d,level,seen){
 const bank=REVIEWED_BATCH_9[d.name]||REVIEWED_BATCH_8[d.name]||REVIEWED_BATCH_7[d.name]||REVIEWED_BATCH_6[d.name]||REVIEWED_BATCH_5[d.name]||REVIEWED_BATCH_4[d.name]||REVIEWED_BATCH_3[d.name]||REVIEWED_BATCH_2[d.name]||REVIEWED_BATCH_1[d.name]||CURATED_QUESTIONS[d.name]||ADDITIONAL_QUESTIONS[d.name];

 return bank[level].map(q=>{const c={...q,options:q.mode==='bool'?q.options.map(x=>({...x})):shuffle(q.options.map(x=>({...x})),r)};c.correct=c.options.map((x,i)=>x.ok?i:-1).filter(i=>i>=0);return c});

function selectFiveQuestions(questions,attempts){

  const skip=attempts%6;
  const pool=questions.filter((_,i)=>i!==skip);
  // Preserve five distinct curriculum topics, while preferring different answer sets.
  return pool.slice(0,QUESTIONS_PER_ROUND);

function startDrug(id){selected=DRUGS.find(x=>x.id===id);view='drug';render();scrollTo(0,0)}function startSession(){const p=prog(selected);let level=Math.min(p.stage,2);session={d:selected,level,questions:selectFiveQuestions(createQuiz(selected,level,p.seen||[]),p.attempts||0),i:0,chosen:[],marked:[],complete:false};view='quiz';render();scrollTo(0,0)}function answer(i){let s=session;if(s.marked.length)return;if(s.questions[s.i].mode==='multi'){s.chosen=s.chosen.includes(i)?s.chosen.filter(x=>x!==i):[...s.chosen,i]}else{s.chosen=[i];s.marked=[...s.chosen];}render()}function submitMulti(){if(!session.chosen.length)return;session.marked=[...session.chosen];render()}function nextQuestion(){const s=session,q=s.questions[s.i];const correct=s.marked.length===q.correct.length&&q.correct.every(i=>s.marked.includes(i));s.questions[s.i].wasCorrect=correct; s.i++;s.chosen=[];s.marked=[];if(s.i>=s.questions.length){finishQuiz();}else render();scrollTo(0,0)}function finishQuiz(){const s=session,p=prog(s.d),n=s.questions.filter(q=>q.wasCorrect).length;const old=p.stage;p.attempts++;p.correct+=n;p.answered+=s.questions.length;s.questions.forEach(q=>{if(!q.wasCorrect)p.mistakes[q.key]=(p.mistakes[q.key]||0)+1;(p.seen||(p.seen=[])).push(...q.sourceIds.map(id=>`${s.level}:${q.key}:${id}`))});p.seen=p.seen.slice(-150);if(n===s.questions.length&&p.stage===s.level&&p.stage<3)p.stage++;setprog(s.d,p);save.history.unshift({id:s.d.id,name:s.d.name,level:s.level,score:n,date:new Date().toISOString()});save.history=save.history.slice(0,300);persist();s.score=n;s.passed=n===s.questions.length&&old===s.level;s.complete=true;view='result';render()}

 if(['アムロジピン','ニフェジピン','エナラプリル','ロサルタン','ビソプロロール','フロセミド','スピロノラクトン'].includes(n))return 'bp';
 if(['エンパグリフロジン','メトホルミン','セマグルチド','シタグリプチン','インスリン グラルギン','インスリングラルギン'].includes(n)||c==='糖尿病'||c==='内分泌')return 'diabetes';

}

// Left-edge swipe navigation: category -> shelves, drug -> category, quiz/result/card -> drug.
let edgeSwipeStart=null;
function edgeBack(){
  if(view==='quiz'){
    if(!confirm('問題を中断して薬剤カードに戻りますか？\nこの挑戦の途中経過は保存されません。'))return;
    const id=session?.d?.id||selected?.id;
    if(id){session=null;startDrug(id)}
  }else if(view==='result'||view==='card'){
    if(selected){session=null;startDrug(selected.id)}
  }else if(view==='drug'){
    if(selected)openShelf(selected.category)
  }else if(view==='catalog'&&category){openShelf(null)}
}
document.addEventListener('touchstart',e=>{
  if(e.touches.length!==1||!(['catalog','drug','quiz','result','card'].includes(view))||(view==='catalog'&&!category)){
    edgeSwipeStart=null;return;
  }
  const t=e.touches[0];edgeSwipeStart=t.clientX<=55?{x:t.clientX,y:t.clientY}:null;
},{passive:true});
document.addEventListener('touchend',e=>{
  if(!edgeSwipeStart)return;
  const t=e.changedTouches[0],dx=t.clientX-edgeSwipeStart.x,dy=t.clientY-edgeSwipeStart.y;
  edgeSwipeStart=null;
  if(dx>=85&&Math.abs(dy)<=65&&dx>Math.abs(dy)*1.5)edgeBack();
},{passive:true});
document.addEventListener('touchcancel',()=>{edgeSwipeStart=null;},{passive:true});

function wrongChoiceInfo(q){
 if(q.mode==='bool'){
   if(q.statementOrigin)return `問題文の記述は「${q.statementOrigin}」の登録情報から作られたものです。`;
   return 'この正誤問題は特定の別の薬剤を答えとして想定していません。';
 }
 const incorrect=q.options.map((o,i)=>({o,i})).filter(v=>!v.o.ok);

   const letter=String.fromCharCode(65+i);
   let msg=o.origin?`元の登録情報：${o.origin}`:CURATED_DISTRACTOR_NOTES[o.t];
   if(!msg)msg='特定の1薬剤に対応するとは限らない選択肢です。';
   return `<div class="choice-source"><b>${letter}：</b>${esc(msg)}</div>`;
 }).join('');
}

function quizView(){const s=session,q=s.questions[s.i],answered=s.marked.length>0,isMulti=q.mode==='multi',ok=answered&&s.marked.length===q.correct.length&&q.correct.every(x=>s.marked.includes(x));return `<button class="back" onclick="startDrug('${s.d.id}')">‹ 挑戦を中断</button><div class="flex"><span class="tag">${stages[s.level]}</span><span class="mini">${s.i+1} / ${s.questions.length}問</span></div><div class="progress"><i style="width:${(s.i+1)/s.questions.length*100}%"></i></div><div class="panel"><div class="overline">${esc(s.d.name)} / ${q.label}</div><div class="questionTitle">${esc(q.title)}</div><p class="mini">${q.mode==='multi'?'複数選択：正しいものをすべて選び、解答を確定してください。':q.mode==='bool'?'正誤判定':'4択問題：正しいものを1つ選択'}</p>${q.options.map((o,i)=>`<button class="option ${answered?(o.ok?'correct':s.marked.includes(i)?'wrong':''):s.chosen.includes(i)?'chosen':''}" ${answered?'disabled':''} onclick="answer(${i})"><span class="letter">${q.mode==='bool'?(i===0?'○':'×'):String.fromCharCode(65+i)}</span><span>${esc(o.t)}</span></button>`).join('')}${!answered&&isMulti?`<button class="btn" onclick="submitMulti()" ${s.chosen.length?'':'disabled'}>解答を確定する</button>`:''}${answered?`<div class="feedback ${ok?'':'bad'}"><b>${ok?'✓ 正解！':'✕ 不正解'}</b><div>${esc(q.explanation)}</div>${!ok?`<div class="mini">正解：${q.correct.map(i=>q.mode==='bool'?(i===0?'正しい':'誤り'):String.fromCharCode(65+i)).join('・')}</div>`:''}${q.options.some(o=>o.reason)?`<div class="option-reasons"><b>選択肢ごとの解説</b>${q.options.map((o,i)=>o.reason?`<div class="option-reason"><b>${q.mode==='bool'?(i===0?'○':'×'):String.fromCharCode(65+i)} ${o.ok?'✓':'✕'}</b> ${esc(o.reason)}</div>`:'').join('')}</div>`:(!ok?`<div class="wrong-sources"><b>誤りの選択肢について</b>${wrongChoiceInfo(q)}</div>`:'')}</div><button class="btn" onclick="nextQuestion()">${s.i===s.questions.length-1?'結果を見る':'次の問題へ'} →</button>`:''}</div>`}
function resultView(){const s=session,p=prog(s.d),unlock=p.stage===3&&s.passed;return `<div class="panel hero"><div class="medal">${unlock?'🏆':s.passed?'✨':s.score>=Math.ceil(s.questions.length*2/3)?'📘':'💪'}</div><div class="overline" style="text-align:center">${esc(s.d.name)} / ${stages[s.level]}</div><div class="name">${s.score} / ${s.questions.length}問正解</div><p class="subline" style="text-align:center">${unlock?'MASTER達成！薬剤カードを獲得しました。':s.passed?'全問正解！次の段階が解放されました。':'5問全問正解でクリア！苦手項目を確認して再挑戦しよう。'}</p>${s.questions.map(q=>`<div class="detail"><h4>${q.wasCorrect?'✓':'✕'} ${q.label}</h4><p>${esc(s.d[q.key])}</p></div>`).join('')}${unlock?`<button class="btn" onclick="showCard()">獲得カードを見る</button>`:`<button class="btn" onclick="startSession()">${s.passed?'次の段階に挑戦':'同じ段階に再挑戦'} →</button>`}<button class="btn alt" onclick="startDrug('${s.d.id}')">薬剤トップへ</button></div>`}
function recordsView(){let top=DRUGS.filter(d=>prog(d).attempts).sort((a,b)=>prog(b).attempts-prog(a).attempts);let mistakes={};DRUGS.forEach(d=>Object.entries(prog(d).mistakes||{}).forEach(([k,n])=>mistakes[k]=(mistakes[k]||0)+n));return header('学習記録','挑戦状況と苦手項目')+`<div class="statrow"><div class="stat"><b>${DRUGS.filter(d=>prog(d).stage===3).length}</b><span>獲得カード</span></div><div class="stat"><b>${save.history.length}</b><span>挑戦回数</span></div><div class="stat"><b>${save.history.filter(h=>h.score===QUESTIONS_PER_ROUND).length}</b><span>全問正解</span></div></div><div class="section">間違えた項目</div><div class="panel">${TOPICS.map(([k,label])=>`<div class="flex" style="padding:8px 0"><span>${label}</span><b>${mistakes[k]||0}回</b></div>`).join('')}</div><div class="section">最近の挑戦</div><div class="panel">${save.history.length?save.history.slice(0,20).map(h=>`<div class="detail"><div class="flex"><b>${esc(h.name)}</b><span class="tag">${h.score}/6</span></div><div class="mini">${stages[h.level]} ・ ${new Date(h.date).toLocaleString('ja-JP')}</div></div>`).join(''):'まだ記録がありません'}</div>`}
function exportData(){const blob=new Blob([JSON.stringify(save,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='drug_collection_backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}function importData(e){const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(d.version!==1||typeof d.progress!=='object'||!Array.isArray(d.history))throw Error('形式が違います');if(!confirm('現在の学習記録をバックアップの内容で上書きしますか？'))return;save=d;persist();setView('home')}catch(err){alert('バックアップファイルを読み込めませんでした')}})}
function settingsView(){return header('設定','保存・データについて')+`<div class="panel"><b>DRUG COLLECTION v1.33</b><p class="subline">30薬剤収録／3段階／6項目・5問／自動問題生成。端末内に学習履歴を保存します。</p><button class="btn alt" onclick="exportData()">学習データをバックアップする</button><p class="mini">バックアップから復元</p><input style="max-width:100%;color:white" type="file" accept=".json,application/json" onchange="importData(event)"></div><div class="panel"><b>医薬品情報について</b><p class="notice">収録内容は学習用の要約です。掲載する代表製剤以外では適応・禁忌・用法等が異なる場合があります。薬剤情報と問題の全件照合は継続中であり、臨床判断には使用しないでください。</p><a href="https://www.pmda.go.jp/PmdaSearch/iyakuSearch/" target="_blank" rel="noopener">PMDA 医療用医薬品情報検索 ↗</a></div><div class="panel"><b>データ管理</b><p class="notice">ブラウザや端末のデータ消去で学習記録が失われることがあります。定期的にバックアップしてください。</p><button class="btn ghost" onclick="if(confirm('すべての学習記録を削除します。よろしいですか？')){save={version:1,progress:{},history:[]};persist();setView('home')}">学習記録を初期化</button></div>`}
function render(){app.innerHTML=view==='home'?home():view==='catalog'?catalog():view==='drug'?drugView():view==='quiz'?quizView():view==='result'?resultView():view==='card'?cardView():view==='records'?home():home();document.querySelectorAll('.nav button').forEach(b=>{let v=view==='drug'||view==='quiz'||view==='result'||view==='card'?'catalog':view;b.classList.toggle('sel',b.dataset.tab===v);b.onclick=()=>setView(b.dataset.tab)})}render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
